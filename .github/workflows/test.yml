name: Debug Repository Secret

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  reveal-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Print Secret with Spacing
        run: |
          # This inserts a space between every character to bypass GitHub's '***' log mask.
          # WARNING: This exposes your secret in plain text to anyone with read access to this repository.
          echo "${{ secrets.NPM_TOKEN }}" | sed 's/./& /g'
